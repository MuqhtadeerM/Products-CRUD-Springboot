services:

  postgres:
    image: postgres:18
    container_name: product-api-db
    environment:
      POSTGRES_DB: product_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    container_name: product-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: change-this-to-a-long-secret-key-for-development-only-123456789
      JWT_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000

volumes:
  postgres_data: